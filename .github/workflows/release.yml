name: Publish Windows release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the version from the tag
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/build.ps1 -Version $env:RELEASE_TAG
      - name: Test reader and update selection
        shell: powershell
        run: ./scripts/test.ps1
      - name: Test interface
        run: |
          node tests/i18n.cjs
          node tests/map-tracking.cjs
      - name: Publish ZIP and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $package = "outputs/HyruleSync-$env:RELEASE_TAG-windows.zip"
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'This tag already has a published release. Use a new version tag.' }
            gh release upload $env:RELEASE_TAG $package "$package.sha256" --clobber
          } else {
            gh release create $env:RELEASE_TAG $package "$package.sha256" --verify-tag --draft --title "HyruleSync $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the draft release with its downloads.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release. The draft and its assets are preserved.' }
