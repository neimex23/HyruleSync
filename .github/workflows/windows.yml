name: Build Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Lint and test React interface
        run: |
          npm ci
          npm run lint
          npm test
      - name: Build standalone executable
        shell: powershell
        run: ./scripts/build.ps1
      - name: Test save reader with synthetic fixtures
        shell: powershell
        run: ./scripts/test.ps1
      - name: Test Windows HTTP, language and page lifetime integration
        run: npm run test:integration
      - uses: actions/upload-artifact@v7
        with:
          name: HyruleSync-Windows
          path: |
            outputs/HyruleSync-v*-windows.zip
            outputs/HyruleSync-v*-windows.zip.sha256
          if-no-files-found: error
